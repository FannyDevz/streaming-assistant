<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Segera Dimulai — Streaming Assistant</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="./scenes.css?v=3" />
  </head>
  <body
    data-scene="start"
    data-title="SEGERA DIMULAI"
    data-subtitle="Siapin cemilan — stream sebentar lagi mulai!"
    data-emoji="⏰"
    data-badge="Segera Live"
    data-handle="@streamer"
    data-cd-done="🚀 MULAI!"
    style="--bg: var(--cyan); --accent: var(--yellow)"
  >
    <div class="burst"></div>
    <div class="petals">
      <span class="petal">🌸</span><span class="petal">🌸</span><span class="petal">🌸</span>
      <span class="petal">🌸</span><span class="petal">🌸</span><span class="petal">🌸</span>
      <span class="petal">🌸</span><span class="petal">🌸</span><span class="petal">🌸</span>
      <span class="petal">🌸</span>
    </div>
    <span class="spark s1">✨</span><span class="spark s2">✨</span>
    <span class="spark s3">✨</span><span class="spark s4">✨</span>
    <div class="deco c1"></div>
    <div class="deco c2"></div>
    <div class="deco c3"></div>
    <div class="deco c4"></div>

    <div class="card">
      <div class="jp">まもなく開始</div>
      <span class="badge"><span class="dot"></span><span class="badge-text">SEGERA LIVE</span></span>
      <span class="emoji">⏰</span>
      <h1 class="title">SEGERA DIMULAI</h1>
      <p class="subtitle">Siapin cemilan — stream sebentar lagi mulai!</p>
      <div class="countdown">
        <div class="cd-label">Mulai dalam</div>
        <div class="cd-time">--:--</div>
      </div>
    </div>

    <div class="footer">
      <div class="chip clock">🕒 --:--</div>
      <div class="chip handle">@streamer</div>
    </div>

    <script src="./scenes.js?v=2"></script>
  </body>
</html>
