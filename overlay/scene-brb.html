<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ngobrol Dulu — Streaming Assistant</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="./scenes.css?v=3" />
  </head>
  <body
    data-scene="brb"
    data-title="NGOBROL DULU"
    data-subtitle="Santai dulu ya — kita lanjut sebentar lagi 🎮"
    data-emoji="💬"
    data-badge="Break Sebentar"
    data-handle="@streamer"
    data-cd-done="✨ LANJUT!"
    style="--bg: var(--pink); --accent: var(--yellow)"
  >
    <div class="petals">
      <span class="petal">🌸</span><span class="petal">🌸</span><span class="petal">🌸</span>
      <span class="petal">🌸</span><span class="petal">🌸</span><span class="petal">🌸</span>
      <span class="petal">🌸</span><span class="petal">🌸</span><span class="petal">🌸</span>
      <span class="petal">🌸</span>
    </div>
    <span class="spark s1">✨</span><span class="spark s2">✨</span>
    <span class="spark s3">✨</span><span class="spark s4">✨</span>
    <div class="deco c1"></div>
    <div class="deco c4"></div>

    <div class="stage">
      <!-- Bingkai kamera: taruh sumber webcam di OBS persis di atas kotak ini. -->
      <div class="cam">
        <div class="cam-hint">
          <span class="big">📷</span>
          KAMERA
          <br /><small>Taruh sumber webcam di sini</small>
        </div>
      </div>

      <div class="card">
        <div class="jp">ちょっと待ってね</div>
        <span class="badge"><span class="dot"></span><span class="badge-text">BREAK SEBENTAR</span></span>
        <span class="emoji">💬</span>
        <h1 class="title">NGOBROL DULU</h1>
        <p class="subtitle">Santai dulu ya — kita lanjut sebentar lagi 🎮</p>
        <div class="countdown">
          <div class="cd-label">Lanjut dalam</div>
          <div class="cd-time">--:--</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="chip clock">🕒 --:--</div>
      <div class="chip handle">@streamer</div>
    </div>

    <script src="./scenes.js?v=2"></script>
  </body>
</html>
