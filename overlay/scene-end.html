<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream Selesai — Streaming Assistant</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="./scenes.css?v=3" />
  </head>
  <body
    data-scene="end"
    data-title="STREAM SELESAI"
    data-subtitle="Makasih udah nonton! Sampai ketemu di stream berikutnya 🙌"
    data-emoji="👋"
    data-badge="Sampai Jumpa"
    data-handle="@streamer"
    style="--bg: var(--purple); --accent: var(--pink)"
  >
    <div class="burst"></div>
    <div class="petals">
      <span class="petal">✨</span><span class="petal">🌸</span><span class="petal">✨</span>
      <span class="petal">🌟</span><span class="petal">✨</span><span class="petal">🌸</span>
      <span class="petal">✨</span><span class="petal">🌟</span><span class="petal">✨</span>
      <span class="petal">🌸</span>
    </div>
    <span class="spark s1">⭐</span><span class="spark s2">✨</span>
    <span class="spark s3">⭐</span><span class="spark s4">✨</span>
    <div class="deco c1"></div>
    <div class="deco c2"></div>
    <div class="deco c3"></div>
    <div class="deco c4"></div>

    <div class="card">
      <div class="jp">またね！</div>
      <span class="badge"><span class="dot"></span><span class="badge-text">SAMPAI JUMPA</span></span>
      <span class="emoji">👋</span>
      <h1 class="title">STREAM SELESAI</h1>
      <p class="subtitle">Makasih udah nonton! Sampai ketemu di stream berikutnya 🙌</p>
    </div>

    <div class="footer">
      <div class="chip clock">🕒 --:--</div>
      <div class="chip handle">@streamer</div>
    </div>

    <script src="./scenes.js?v=2"></script>
  </body>
</html>
