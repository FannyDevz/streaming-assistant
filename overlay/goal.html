<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goal Bar — Streaming Assistant</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="./goal.css" />
  </head>
  <body>
    <div id="wrap" class="wrap" hidden>
      <div class="top">
        <span id="label" class="label">Target</span>
        <span id="pct" class="pct">0%</span>
      </div>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="nums"><span id="cur">0</span> / <span id="tgt">0</span> 🪙</div>
    </div>
    <script src="./goal.js"></script>
  </body>
</html>
